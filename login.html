<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AnixMiru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <nav>
    <a class="brand" href="index.html">
      <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="rg1" x1="0" y1="0" x2="120" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e21e9c"/><stop offset="30%" stop-color="#7b1fa2"/><stop offset="62%" stop-color="#ff6a1a"/><stop offset="100%" stop-color="#ffb62b"/>
        </linearGradient></defs>
        <path d="M10 78C4 84 6 92 14 92C22 92 34 82 40 68L58 22L76 68C80 78 90 84 98 78" stroke="url(#rg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M40 68C48 50 66 40 78 52C90 64 78 78 66 70L40 46" stroke="url(#rg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="name">Anix<span class="mi">Miru</span></div>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="schedule.html">Schedule</a>
    </div>
    <div class="nav-actions">
      <a class="btn-ghost" href="signup.html">Create account</a>
    </div>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html" style="justify-content:center;">
        <svg viewBox="0 0 120 100" width="30" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 78C4 84 6 92 14 92C22 92 34 82 40 68L58 22L76 68C80 78 90 84 98 78" stroke="url(#rg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 68C48 50 66 40 78 52C90 64 78 78 66 70L40 46" stroke="url(#rg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="name">Anix<span class="mi">Miru</span></div>
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to sync your list and watch progress.</p>

      <form onsubmit="event.preventDefault();">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" placeholder="••••••••">
        </div>
        <div class="field-row">
          <label style="display:flex; align-items:center; gap:7px;"><input type="checkbox" style="accent-color:var(--magenta);"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn-primary" type="submit">Sign in</button>
      </form>

      <div class="divider">or continue with</div>
      <div class="oauth-row">
        <button class="oauth-btn">Google</button>
        <button class="oauth-btn">Discord</button>
      </div>

      <div class="auth-foot">New to AnixMiru? <a href="signup.html">Create an account</a></div>
    </div>
  </div>
</main>

<footer>
  <div class="foot-bottom" style="max-width:1240px; margin:0 auto; border-top:none; padding-top:0;">
    <span>© 2026 AnixMiru. Fan project — not affiliated with any studio.</span>
    <span>Made for anime nights.</span>
  </div>
</footer>

</body>
</html>
